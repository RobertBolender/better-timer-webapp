<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Timer App</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(to bottom right, #5f7cc9, #8b6bbd);
      color: white;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; font-size: 2.5rem; }
    .panel {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    input::placeholder { color: rgba(255,255,255,0.7); }
    button {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: #5f7cc9; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: rgba(255,255,255,0.25); color: white; }
    .display { font-size: 4rem; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; }
    .progress-wrap {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 5px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-fill {
      height: 100%;
      background: white;
      width: 0%;
      transition: width 0.1s linear;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-title {
      font-size: 2rem;
      margin-bottom: 15px;
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .modal-instructions {
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-align: center;
      color: #ff6b6b;
    }
    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 350px;
      width: 100%;
    }
    .circle-target {
      aspect-ratio: 1;
      border: 3px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      touch-action: none;
      transition: all 0.3s;
    }
    .circle-target.origin {
      background: #5f7cc9;
      border-color: #5f7cc9;
      box-shadow: 0 0 25px rgba(95,124,201,0.8);
      animation: pulse-origin 1s infinite;
    }
    .circle-target.destination {
      background: #e74c3c;
      border-color: #e74c3c;
      box-shadow: 0 0 25px rgba(231,76,60,0.8);
      animation: pulse-dest 1s infinite;
    }
    @keyframes pulse-origin {
      0%, 100% { box-shadow: 0 0 20px rgba(95,124,201,0.6); }
      50% { box-shadow: 0 0 35px rgba(95,124,201,1); }
    }
    @keyframes pulse-dest {
      0%, 100% { box-shadow: 0 0 20px rgba(231,76,60,0.6); }
      50% { box-shadow: 0 0 35px rgba(231,76,60,1); }
    }
    .circle-target.being-dragged { opacity: 0.4; transform: scale(0.9); }
    .circle-target.hover-target { background: rgba(95,124,201,0.6); transform: scale(1.15); }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Better Timer</h1>
    
    <div class="panel" id="configPanel">
      <div class="field">
        <label for="inputMinutes">Minutes</label>
        <input type="number" id="inputMinutes" value="1" min="0" step="1">
      </div>
      <div class="field">
        <label for="inputSeconds">Seconds</label>
        <input type="number" id="inputSeconds" value="0" min="0" max="59" step="1">
      </div>
      <button class="btn-primary" id="btnBegin">Start Timer</button>
    </div>

    <div class="panel hidden" id="activePanel">
      <div class="display" id="timerDisplay">00:00</div>
      <div class="progress-wrap">
        <div class="progress-fill" id="timerProgress"></div>
      </div>
      <button class="btn-danger" id="btnCancel">Stop Timer</button>
      <button class="btn-secondary" id="btnRestart">Reset Timer</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="snoozeModal">
    <div class="modal-title">⏰ TIME IS UP! ⏰</div>
    <div class="modal-instructions" id="instructionText">
      Hold and drag from BLUE to RED circle
    </div>
    <div class="grid-3x3" id="dragGrid">
      <!-- Generated by JavaScript -->
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(r => console.log('Service Worker active'))
          .catch(e => console.error('Service Worker failed', e));
      });
    }
  </script>
</body>
</html>
